[workspace]
exclude = ["vendor"]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/EuLucaDev/novaeffect"

[workspace.dependencies]
# internal
novaeffect-time = { path = "crates/time" }
novaeffect-geom = { path = "crates/geom" }
novaeffect-color = { path = "crates/color" }
novaeffect-raster = { path = "crates/raster" }
novaeffect-path = { path = "crates/path" }
novaeffect-keyframe = { path = "crates/keyframe" }
novaeffect-project = { path = "crates/project" }
novaeffect-text = { path = "crates/text" }
novaeffect-effects = { path = "crates/effects" }
novaeffect-track = { path = "crates/track" }
novaeffect-segment = { path = "crates/segment" }
novaeffect-model = { path = "crates/model" }
novaeffect-render = { path = "crates/render" }
novaeffect-gpu = { path = "crates/gpu" }
novaeffect-media = { path = "crates/media" }
novaeffect-export = { path = "crates/export" }
novaeffect-expr = { path = "crates/expr" }
novaeffect-lottie = { path = "crates/lottie" }
novaeffect-interchange = { path = "crates/interchange" }
novaeffect-pdf = { path = "crates/pdf" }
novaeffect-psd = { path = "crates/psd" }
novaeffect-vp9enc = { path = "crates/vp9enc" }
novaeffect-svg = { path = "crates/svg" }
novaeffect-engine = { path = "crates/engine" }
novaeffect-host = { path = "crates/host" }
novaeffect-ui-egui = { path = "crates/ui-egui" }
novaeffect-automation = { path = "crates/automation" }
novaeffect-opusenc = { path = "crates/opusenc" }
novaeffect-script = { path = "crates/script" }
novaeffect-hevcenc = { path = "crates/hevcenc" }
novaeffect-av1enc = { path = "crates/av1enc" }
novaeffect-plugin = { path = "crates/plugin" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
# std::time::Instant/SystemTime on native; the browser clock on wasm32 (std's panic there).
web-time = "1"
gif = "0.14"
proptest = "1"

# scripting (expressions)
boa_engine = { version = "0.22", default-features = false }
# WebAssembly effect plug-ins (sandboxed interpreter; MIT/Apache-2.0, pure Rust)
wasmi = { version = "2", default-features = false, features = ["std", "validate", "wat", "deterministic", "portable-dispatch"] }

# geometry / fonts
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# media codecs + containers: NovaFilm's pure-Rust crates, pinned to a revision (plan/adr/0001).
# Only `crates/media`, `crates/export` and `crates/interchange` may depend on these.
novafilm-codecs = { path = "vendor/novafilm-2c5ba7a726/crates/codecs" }
novafilm-media = { path = "vendor/novafilm-2c5ba7a726/crates/media" }
novafilm-frame = { path = "vendor/novafilm-2c5ba7a726/crates/frame" }
novafilm-color = { path = "vendor/novafilm-2c5ba7a726/crates/color" }
novafilm-time = { path = "vendor/novafilm-2c5ba7a726/crates/time" }
# encoders + muxer (crates/export)
novafilm-h264enc = { path = "vendor/novafilm-2c5ba7a726/crates/h264enc" }
novafilm-prores = { path = "vendor/novafilm-2c5ba7a726/crates/prores" }
novafilm-aac = { path = "vendor/novafilm-2c5ba7a726/crates/aac" }
novafilm-isobmff = { path = "vendor/novafilm-2c5ba7a726/crates/isobmff" }
# decoder used as the round-trip oracle of novaeffect-opusenc (crates/export dev-dependency)
novafilm-opus = { path = "vendor/novafilm-2c5ba7a726/crates/opus" }
novafilm-vp9 = { path = "vendor/novafilm-2c5ba7a726/crates/vp9" }
# decoders used as the round-trip oracles of novaeffect-hevcenc / novaeffect-av1enc (dev-dependencies only)
novafilm-hevc = { path = "vendor/novafilm-2c5ba7a726/crates/hevc" }
novafilm-av1 = { path = "vendor/novafilm-2c5ba7a726/crates/av1" }
# timeline interchange (EDL, FCP7 XML, FCPXML, OTIO) for Premiere Pro interop (crates/interchange only)
novafilm-interchange = { path = "vendor/novafilm-2c5ba7a726/crates/interchange" }
novafilm-project = { path = "vendor/novafilm-2c5ba7a726/crates/project" }
novafilm-geom = { path = "vendor/novafilm-2c5ba7a726/crates/geom" }

# gpu (the same wgpu eframe / egui-wgpu use)
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "0.4"

# ui
# Shared frontend components; keep this dependency above the engine boundary.
nova-ui = { path = "vendor/novafoods-libs-5c874d51ee/crates/ui", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
cpal = "0.16"
# The operating system's interface language (MIT/Apache-2.0, no dependencies on desktop).
sys-locale = "0.3"

# Local co-development against a NovaFilm checkout next to this repo: uncomment.
# [patch."https://github.com/EuLucaDev/novafilm"]
# novafilm-codecs = { path = "../novafilm/crates/codecs" }
# novafilm-media = { path = "../novafilm/crates/media" }
# novafilm-frame = { path = "../novafilm/crates/frame" }
# novafilm-color = { path = "../novafilm/crates/color" }
# novafilm-time = { path = "../novafilm/crates/time" }
# novafilm-h264enc = { path = "../novafilm/crates/h264enc" }
# novafilm-prores = { path = "../novafilm/crates/prores" }
# novafilm-aac = { path = "../novafilm/crates/aac" }
# novafilm-isobmff = { path = "../novafilm/crates/isobmff" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Pixel hot loops: keep debug builds interactive.
[profile.dev.package.novaeffect-raster]
opt-level = 3

[profile.dev.package.novaeffect-render]
opt-level = 3

[profile.dev.package.novaeffect-gpu]
opt-level = 3

[profile.dev.package.novaeffect-effects]
opt-level = 3

[profile.dev.package.novaeffect-track]
opt-level = 3

[profile.dev.package.novaeffect-path]
opt-level = 3

[profile.dev.package.novaeffect-media]
opt-level = 3

[profile.dev.package.novaeffect-opusenc]
opt-level = 3

[profile.dev.package.novaeffect-export]
opt-level = 3

[profile.dev.package.novaeffect-vp9enc]
opt-level = 3

[profile.dev.package.novaeffect-hevcenc]
opt-level = 3

[profile.dev.package.novaeffect-av1enc]
opt-level = 3

# NovaFilm codec hot loops (same settings as NovaFilm's own workspace).
[profile.dev.package.novafilm-h264]
opt-level = 3

[profile.dev.package.novafilm-h264enc]
opt-level = 3

[profile.dev.package.novafilm-hevc]
opt-level = 3

[profile.dev.package.novafilm-vp9]
opt-level = 3

[profile.dev.package.novafilm-prores]
opt-level = 3

[profile.dev.package.novafilm-dnx]
opt-level = 3

[profile.dev.package.novafilm-av1]
opt-level = 3

[profile.dev.package.novafilm-aac]
opt-level = 3

[profile.dev.package.novafilm-opus]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
