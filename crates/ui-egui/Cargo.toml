[package]
name = "novaeffect-ui-egui"
description = "The NovaEffect egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
nova-ui = { workspace = true }
novaeffect-time = { workspace = true }
novaeffect-geom = { workspace = true }
novaeffect-color = { workspace = true }
novaeffect-keyframe = { workspace = true }
novaeffect-project = { workspace = true }
novaeffect-path = { workspace = true }
novaeffect-text = { workspace = true }
novaeffect-render = { workspace = true }
novaeffect-engine = { workspace = true }
novaeffect-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nova-live = { git = "https://github.com/EuLucaDev/nova-live", rev = "4bae300bfa60a31ef62f1d9f28a4cd067b46ed7c" }

sys-locale = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "0.4"
novaeffect-host = { workspace = true }
exr = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
